version: 2

sources:
  - name: bronze
    schema: bronze
    description: Raw CMS provider claims loaded by PySpark normalize job
    tables:
      - name: provider_claims
        description: Raw Medicare physician/supplier claims by provider and HCPCS code
        freshness:
          warn_after: {count: 14, period: day}
          error_after: {count: 30, period: day}
        loaded_at_field: ingested_at
        columns:
          - name: provider_npi
            description: National Provider Identifier (10-digit unique ID)
            tests:
              - not_null
          - name: hcpcs_code
            description: Healthcare Common Procedure Coding System code
          - name: avg_medicare_payment
            description: Average Medicare payment amount for this provider/procedure pair

models:
  - name: stg_providers
    description: Cleaned and standardised provider claims, one row per provider+HCPCS combination
    columns:
      - name: provider_npi
        description: National Provider Identifier
        tests:
          - not_null
      - name: provider_state
        description: Uppercase 2-letter US state abbreviation
        tests:
          - not_null
          - accepted_values:
              values: [AL, AK, AZ, AR, CA, CO, CT, DE, FL, GA, HI, ID, IL, IN, IA,
                       KS, KY, LA, ME, MD, MA, MI, MN, MS, MO, MT, NE, NV, NH, NJ,
                       NM, NY, NC, ND, OH, OK, OR, PA, RI, SC, SD, TN, TX, UT, VT,
                       VA, WA, WV, WI, WY, DC, PR, VI, GU, AS, MP, ZZ]
      - name: hcpcs_code
        description: HCPCS procedure code
        tests:
          - not_null
      - name: avg_medicare_payment
        description: Average Medicare payment — must be non-negative
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
