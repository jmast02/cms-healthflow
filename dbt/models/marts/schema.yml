version: 2

models:
  - name: provider_profiles
    description: One row per provider NPI with aggregated payment metrics and specialty/state rankings
    columns:
      - name: provider_npi
        description: National Provider Identifier — unique key
        tests:
          - unique
          - not_null
      - name: avg_medicare_payment
        tests:
          - not_null
      - name: specialty_rank
        tests:
          - not_null
      - name: state_rank
        tests:
          - not_null

  - name: procedure_costs
    description: Per-procedure cost analytics by state — avg, median, min, max payments
    columns:
      - name: hcpcs_code
        tests:
          - not_null
      - name: provider_state
        tests:
          - not_null
      - name: avg_medicare_payment
        tests:
          - not_null

  - name: cost_by_geography
    description: Average Medicare costs by state and ZIP code — powers the geographic heatmap
    columns:
      - name: provider_state
        tests:
          - not_null
      - name: provider_zip
        tests:
          - not_null
      - name: avg_medicare_payment
        tests:
          - not_null

  - name: hospital_rankings
    description: Hospital quality rankings from CMS Hospital Compare — star ratings and national/state ranks
    columns:
      - name: facility_id
        tests:
          - unique
          - not_null
      - name: state
        tests:
          - not_null
