cms_healthflow:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'healthflow') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'healthflow_secret') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'cms_healthflow') }}"
      schema: silver
      threads: 4
